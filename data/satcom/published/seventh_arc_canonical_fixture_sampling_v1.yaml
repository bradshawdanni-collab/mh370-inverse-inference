  surface:
    horizontal_reference: WGS84
    vertical_reference: WGS84_ELLIPSOID
    ellipsoidal_height_m: 0.0

sampling_rule:
  longitude_domain: HALF_OPEN_NEGATIVE_180_TO_POSITIVE_180
  minimum_longitude_deg: -180.0
  maximum_longitude_deg_exclusive: 180.0
  longitude_step_deg: 1.0
  longitude_values: INTEGER_DEGREES
  latitude_search_minimum_deg: -90.0
  latitude_search_maximum_deg: 90.0
  latitude_bracket_step_deg: 0.25
  root_solver: BRACKETED_BISECTION
  slant_range_residual_tolerance_m: 0.01
  maximum_iterations: 80
  root_inclusion: ALL_DISTINCT_ROOTS_AT_EACH_SAMPLED_LONGITUDE
  branch_preference: NONE
  ordering:
    primary: longitude_deg_ascending
    secondary: latitude_deg_ascending
  endpoint_policy: >
    Include only roots obtained at the declared integer-longitude samples.
    Do not synthesize unsampled tangency endpoints between grid meridians.

canonical_serialization:
  encoding: UTF-8
  line_ending: LF
  final_newline: true
  header: point_id,sequence_index,longitude_deg,latitude_deg,altitude_m
  sequence_index_origin: 0
  point_id_format: arc7-{sequence_index:04d}
  longitude_decimal_places: 8
  latitude_decimal_places: 10
  altitude_literal: "0.0"
  altitude_units: metres
  coordinate_units: degrees
  coordinate_reference_system: WGS84_GEODETIC_EPSG_4979_ZERO_ELLIPSOIDAL_HEIGHT

