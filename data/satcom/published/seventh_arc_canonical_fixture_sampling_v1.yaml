purpose: >
  Freeze the canonical deterministic sampling and serialization rule used to
  materialize the seventh-arc WGS84 zero-ellipsoidal-height benchmark fixture.
  This artifact defines the exact sampled coordinate sequence but does not
  promote the fixture to ADMITTED status.

