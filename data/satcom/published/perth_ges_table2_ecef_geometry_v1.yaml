  rationale:
    - The primary publication explicitly supplies the Perth GES ECEF vector in Table 2 for BTO calibration geometry.
    - Equation 1 explicitly subtracts the range from the satellite to the Perth GES.
    - The publication defines the timing bias as fixed GES and AES processing delay.
    - The publication does not specify a separate antenna phase-centre coordinate or correction term for the BTO geometry.
    - Reproducing the published model must not invent an unreported geometric correction.
  non_claims:
    - This record does not assert that the Table 2 ECEF vector is a surveyed RF antenna phase-centre coordinate.
    - This record does not assert that no physical antenna reference offset exists.
    - This record only fixes the geometry reference used for reproduction of the published BTO model.
precision_and_limitations:
  - Table 2 publishes ECEF coordinates to 0.1 kilometre precision.
  - The displayed precision does not support treating the vector as an exact survey coordinate.
  - If the displayed coordinates were rounded to nearest 0.1 kilometre, the implied half-unit bound is 0.05 kilometre per axis; this is a formatting-derived bound, not a stated source uncertainty.
  - The publication gives approximate latitude and longitude but no ellipsoidal height.
  - Any later WGS84 surface transformation must keep this source precision distinct from numerical computation precision.
