scope_boundary:
  purpose: >
    Define a reproducible candidate transformation from the corrected seventh-arc
    BTO event and admitted geometry inputs to a satellite-to-aircraft slant range.
  exclusions:
    - This record does not admit benchmark coordinates.
    - This record does not create benchmark_fixture.csv.
    - This record does not select a flight path, endpoint, search area, or crash location.
    - This record does not validate the proposed interpolation method as authoritative.

