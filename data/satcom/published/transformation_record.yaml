  interpolation_method_review: PENDING
  altitude_contract_review: PENDING
  independent_mathematical_review: PENDING
  source_pdf_byte_capture_and_sha256: PENDING
  benchmark_id_assignment: BLOCKED
  benchmark_fixture_generation: BLOCKED

admission_requirements_remaining:
  - Capture the exact source PDF bytes and record their SHA-256 digests.
  - Independently verify every extracted Table 2 and Table 4 value.
  - Review or replace the proposed cubic Hermite interpolation contract.
  - Confirm whether an exact event-epoch ephemeris is available.
  - Resolve the Perth GES antenna phase-centre and height questions.
  - Resolve the 10000 m source altitude, 10668 m proposal, and zero-altitude L0.4 contract.
  - Define and test the sphere-to-WGS84 ellipsoid intersection algorithm.
  - Independently review any generated coordinates.
  - Assign a stable benchmark_id and freeze exact fixture bytes only after admission.
