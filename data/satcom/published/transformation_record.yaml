interpolation_sensitivity_check:
  comparison_method: LINEAR_POSITION_INTERPOLATION
  linear_position_at_event_km:
    x: 18178.354124
    y: 38050.845876
    z: 393.02318
  hermite_minus_linear_position_norm_km: 0.02059181610572185
  hermite_minus_linear_position_norm_m: 20.59181610572185
  hermite_minus_linear_satellite_ges_range_km: 0.003880875141476281
  hermite_minus_linear_satellite_ges_range_m: 3.880875141476281
  finding: >
    For the registered bounding nodes, Hermite and linear position interpolation
    differ by approximately 20.6 metres in satellite position and 3.9 metres in
    satellite-to-GES range. Therefore the claim that linear interpolation is
    necessarily insufficient for sub-kilometre accuracy is not established by
    this comparison. Hermite remains proposed because endpoint velocities are
    available, but the authoritative interpolation rule requires independent review.

geodetic_projection_constraints:
  earth_model: WGS84
  source_publication_ring_altitude_m: 10000.0
  proposed_35000_ft_altitude_m: 10668.0
  l04_fixture_altitude_m: 0.0
  altitude_contract_status: UNRESOLVED
  finding: >
    The Inmarsat paper reports rings at an assumed cruising altitude of 10000 m.
    A 10668 m assumption is not source-equivalent, and the current L0.4 fixture
    contract requires zero altitude. No coordinate fixture may be generated until
    this difference is explicitly resolved and documented.
  numerical_tolerances:
    candidate_position_interpolation_km: 0.01
    candidate_velocity_interpolation_km_s: 0.00001
    candidate_wgs84_intersection_m: 1.0
    tolerance_status: PROPOSED_NOT_VALIDATED

verification_status:
