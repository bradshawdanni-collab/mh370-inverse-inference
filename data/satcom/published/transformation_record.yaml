calibration_constants:
  fixed_processing_bias_microseconds: -495679
  speed_of_light_km_s: 299792.458
  range_equation: >
    satellite_aircraft_range_km =
    speed_of_light_km_s *
    (corrected_bto_microseconds - fixed_processing_bias_microseconds) /
    2000000 - satellite_ges_range_km

