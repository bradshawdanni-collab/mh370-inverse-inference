candidate_extraction_review:
  admission_status: EXCLUDED_FROM_ADMISSION
  source_description: User-supplied summary reviewed against official ATSB and Inmarsat publications
  findings:
    - The ATSB BTO characteristics fact sheet is an official methodology and uncertainty reference, not a coordinate benchmark by itself.
    - The amended ATSB signalling-unit logs are the appropriate official source for raw BTO records.
    - The supplied elevation-angle values have not been verified in the registered ATSB artifacts.
    - The supplied handshake table must not be copied into benchmark_fixture.csv without a declared event-selection and calibration rule.
    - Official log records show 11740 microseconds at 20:41:04.904, not 11820.
    - Official log records show 14540 microseconds at 22:41:21.906, not 14360.
    - Official log records show 18040 microseconds at 00:10:59.928, not 16740.
    - The 00:19 event includes an R600 logon request of 23000 microseconds at 00:19:29.416, which becomes 18400 after the declared 4600 microsecond calibration subtraction.
    - The final received R1200 transmission at 00:19:37.443 is a distinct record with BTO 49660 and is excluded from the refined Inmarsat analysis.

rejected_derivations:
  - rejection_id: rejected-bto-constant-minus-11460-v1
    admission_status: EXCLUDED_FROM_ADMISSION
    permanence: PERMANENT_FOR_THIS_DERIVATION
    claim: A -11460 microsecond Perth ground-station constant converts corrected BTO 18400 microseconds into a 4475.89 kilometre satellite-to-aircraft range.
    finding: >
      The proposed -11460 microsecond constant is not established by the
      registered ATSB or Inmarsat primary sources. It conflates the 4600
      microsecond R600 correction, the -495679 microsecond calibrated BTO
      processing bias, and the separately calculated satellite-to-GES range.
    prohibited_uses:
      - Do not calculate a 4475.89 kilometre seventh-arc radius from this derivation.
      - Do not create benchmark_fixture.csv from this derivation.
      - Do not generate geospatial paths, search corridors, or location claims from this derivation.
    replacement_contract:
      corrected_bto_microseconds: 18400
      fixed_processing_bias_microseconds: -495679
      range_equation: satellite_aircraft_range = c * (BTO - bias) / 2 - satellite_GES_range
      unresolved_inputs:
        - exact epoch satellite ECEF state
        - Perth GES geometry
        - declared altitude convention
        - deterministic sphere-to-WGS84 intersection method

benchmark_event_selection_contract:
  contract_status: PROPOSED_PENDING_INDEPENDENT_REVIEW
  benchmark_role: seventh_arc_bto_event
  benchmark_epoch_utc: "2014-03-08T00:19:29.416Z"

  selected_source_record:
    source_artifact_id: atsb-signalling-unit-logs-2017
    message_type: Logon Request
    channel: R
    burst_format: R600
    raw_bto_microseconds: 23000

  calibration:
    rule: corrected_bto_microseconds = raw_bto_microseconds - 4600
    adjustment_microseconds: -4600
    corrected_bto_microseconds: 18400
    authority:
      - atsb-signalling-unit-logs-2017
      - inmarsat-search-for-mh370-2014

  excluded_source_record:
    epoch_utc: "2014-03-08T00:19:37.443Z"
    channel: R
    burst_format: R1200
    raw_bto_microseconds: 49660
    exclusion_reason: >
      Excluded from the refined Inmarsat analysis because the timing is
      unreliable.

  selection_rule:
    - Use the 00:19:29.416 R600 Logon Request as the benchmark BTO event.
    - Apply the declared 4600 microsecond R600 normalization before range calculations.
    - Do not substitute the 00:19:37.443 R1200 record.

  authority_boundary:
    - This contract selects and calibrates a source record only.
    - It does not define the exact satellite state at the selected epoch.
    - It does not generate Earth-surface coordinates or benchmark_fixture.csv.

