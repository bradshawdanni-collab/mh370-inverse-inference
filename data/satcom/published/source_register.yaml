candidate_extraction_review:
  admission_status: EXCLUDED_FROM_ADMISSION
  source_description: User-supplied summary reviewed against official ATSB publications
  findings:
    - The ATSB BTO characteristics fact sheet is an official methodology and uncertainty reference, not a coordinate benchmark by itself.
    - The amended ATSB signalling-unit logs are the appropriate official source for raw BTO records.
    - The supplied elevation-angle values have not been verified in the registered ATSB artifacts.
    - The supplied handshake table must not be copied into benchmark_fixture.csv without a declared event-selection and calibration rule.
    - Official log records show 11740 microseconds at 20:41:04.904, not 11820.
    - Official log records show 14540 microseconds at 22:41:21.906, not 14360.
    - Official log records show 18040 microseconds at 00:10:59.928, not 16740.
    - The 00:19 event includes an R600 logon request of 23000 microseconds at 00:19:29.416, which becomes 18400 after the declared 4600 microsecond calibration subtraction.
    - The final received R1200 transmission at 00:19:37.443 is a distinct record with BTO 49660.

