    provenance:
      authority: Primary technical paper authored by Inmarsat engineers involved in the MH370 SATCOM analysis
      verification_scope:
        - Defines the refined BTO satellite-to-aircraft range equation.
        - Reports the mean fixed BTO processing bias of -495679 microseconds.
        - Reports Perth GES ECEF coordinates in Table 2.
        - Reports Inmarsat-3 F1 ECEF position and velocity nodes in Table 4.
        - States that the 00:19:37 logon-sequence BTO must be ignored and that 18400 microseconds is derived from the 00:19:29 Logon Request.
    transformation_history:
      - Freeze published Table 4 00:10 and 00:20 ECEF endpoint values as inmarsat-3f1-table4-endpoints-20140308.
      - Apply the frozen cubic-Hermite transformation inmarsat-3f1-hermite-transform-v1 at target offset 569.416 seconds.
      - Freeze the derived target state inmarsat-3f1-table4-target-state-20140308T001929416Z and independently review its numerical reproduction.
      - Freeze Perth GES Table 2 ECEF geometry and reproduce the published BTO model without inventing an unreported phase-centre correction.
      - Preserve the source publication's assumed 10000 metre in-flight ring separately from the canonical WGS84 zero-ellipsoidal-height fixture surface.
      - Apply mh370-seventh-arc-bto-wgs84-transform-v1 to derive satellite-to-aircraft range 37861969.39520467 metres and independently reproduce that transformation.
      - Apply mh370-seventh-arc-canonical-fixture-sampling-v1 to sample all distinct zero-height roots at integer longitudes on the half-open [-180, 180) domain.
      - Independently review the exact 176-point sequence and freeze benchmark_fixture.csv bytes with SHA-256 3ae049f3de7383a433cb8b0b2e1a83e503da99d0dd6e0e96bb9cc39b530cd5a7.
    uncertainty_notes:
      - Table 4 endpoint values are rounded to the precision published in the source.
      - The exact 00:19:29.416Z satellite state is interpolation-derived rather than an exact published operational ephemeris row.
      - The publication supplies an approximate Perth latitude and longitude but no ellipsoidal height; the tabulated ECEF vector is used for published-model reproduction without claiming surveyed RF phase-centre identity.
      - The article uses 10000 metres assumed cruising altitude for published in-flight rings; the canonical fixture instead recomputes the range constraint on WGS84 ellipsoidal height 0 metres.
      - The fixture is a deterministic sampled representation of the zero-height locus, not a directly published coordinate sequence and not an inferred aircraft location.

candidate_extraction_review:
  admission_status: EXCLUDED_FROM_ADMISSION
  source_description: User-supplied summary reviewed against official ATSB and Inmarsat publications
  findings:
    - The ATSB BTO characteristics fact sheet is an official methodology and uncertainty reference, not a coordinate benchmark by itself.
    - The amended ATSB signalling-unit logs are the appropriate official source for raw BTO records.
    - The supplied elevation-angle values have not been verified in the registered ATSB artifacts.
    - The supplied handshake table must not be copied into benchmark_fixture.csv without a declared event-selection and calibration rule.
    - Official log records show 11740 microseconds at 20:41:04.904, not 11820.
    - Official log records show 14540 microseconds at 22:41:21.906, not 14360.
    - Official log records show 18040 microseconds at 00:10:59.928, not 16740.
    - The 00:19 event includes an R600 logon request of 23000 microseconds at 00:19:29.416, which becomes 18400 after the declared 4600 microsecond calibration subtraction.
    - The final received R1200 transmission at 00:19:37.443 is a distinct record with BTO 49660 and is excluded from the refined Inmarsat analysis.

rejected_derivations:
  - rejection_id: rejected-bto-constant-minus-11460-v1
    admission_status: EXCLUDED_FROM_ADMISSION
    permanence: PERMANENT_FOR_THIS_DERIVATION
    claim: A -11460 microsecond Perth ground-station constant converts corrected BTO 18400 microseconds into a 4475.89 kilometre satellite-to-aircraft range.
    finding: >
      The proposed -11460 microsecond constant is not established by the
      registered ATSB or Inmarsat primary sources. It conflates the 4600
      microsecond R600 correction, the -495679 microsecond calibrated BTO
      processing bias, and the separately calculated satellite-to-GES range.
    prohibited_uses:
      - Do not calculate a 4475.89 kilometre seventh-arc radius from this derivation.
      - Do not create benchmark_fixture.csv from this derivation.
      - Do not generate geospatial paths, search corridors, or location claims from this derivation.
    replacement_contract:
      corrected_bto_microseconds: 18400
      fixed_processing_bias_microseconds: -495679
      range_equation: satellite_aircraft_range = c * (BTO - bias) / 2 - satellite_GES_range
      replacement_inputs_resolved_by:
        - inmarsat-3f1-table4-target-state-20140308T001929416Z
        - perth-ges-table2-ecef-geometry-v1
        - mh370-seventh-arc-altitude-convention-v1
        - mh370-seventh-arc-bto-wgs84-transform-v1
        - mh370-seventh-arc-bto-wgs84-independent-reproduction-v1

