    units:
      bto: microseconds
      satellite_range_error: kilometres
      line_of_position_error: kilometres
    provenance:
      authority: Official ATSB publication
      verification_scope:
        - BTO is a measured round-trip SATCOM timing quantity used to calculate satellite-to-aircraft distance.
        - BTO-derived distance permits possible location rings to be mapped on the Earth surface.
        - ATSB reports approximately 50 microseconds effective BTO accuracy and approximately 10 kilometres horizontal line-of-position tolerance.
    transformation_history: []
    uncertainty_notes:
      - The fact sheet reports non-Gaussian timing error components and treats individual MH370 measurements separately.
      - The fact sheet does not publish a machine-readable benchmark coordinate sequence.
      - The fact sheet alone cannot produce benchmark_fixture.csv.

