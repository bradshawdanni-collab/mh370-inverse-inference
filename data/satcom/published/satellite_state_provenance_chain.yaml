chain_semantics:
  - Published source bytes remain distinct from extracted values.
  - Extracted endpoint values remain distinct from deterministic interpolation.
  - The derived target state is not represented as an exact published ephemeris row.
  - The mathematical proof verifies the declared transform but does not promote admission state.
  - The method-independent review closes only the satellite-state review subgate and is not an external institutional sign-off.
  - The Perth GES artifact fixes the geometry reference used to reproduce the published BTO model without asserting a surveyed RF phase-centre coordinate.
  - The publication's 10000 metre ring assumption remains distinct from the canonical WGS84 zero-ellipsoidal-height fixture surface.
  - Zero-height fixture coordinates must be recomputed from the frozen BTO and geometry inputs and are derived artifacts, not directly published coordinates.
  - The deterministic BTO transformation derives a zero-height WGS84 locus but does not create or admit benchmark_fixture.csv.
  - The independent transformation review reproduces the range and zero-height locus without using the production published-BTO wrapper for its independent calculation.
  - The independent review's coordinate separation is evaluated against the implementation-regression solver configuration and does not freeze canonical fixture sampling.
  - Historical TLE/SGP4 data is secondary corroboration only.
  - No layer in this chain independently admits benchmark_fixture.csv.
next_gate:
