chain_semantics:
  - Published source bytes remain distinct from extracted values.
  - Extracted endpoint values remain distinct from deterministic interpolation.
  - The derived target state is not represented as an exact published ephemeris row.
  - The mathematical proof verifies the declared transform but does not independently confer admission.
  - The method-independent satellite-state review is not an external institutional sign-off.
  - The Perth GES artifact fixes the geometry reference used to reproduce the published BTO model without asserting a surveyed RF phase-centre coordinate.
  - The publication's 10000 metre ring assumption remains distinct from the canonical WGS84 zero-ellipsoidal-height fixture surface.
  - Zero-height fixture coordinates are recomputed from the frozen BTO and geometry inputs and are derived artifacts, not directly published coordinates.
  - The deterministic BTO transformation and independent reproduction remain distinct from canonical fixture sampling and serialization.
  - The canonical fixture includes both distinct roots at each sampled integer longitude and applies no north/south branch preference.
  - Supporting frozen artifacts retain their creation-stage statuses; benchmark admission is conferred only by the final admission review and the ADMITTED fixture layer.
  - Historical TLE/SGP4 data is secondary corroboration only.
