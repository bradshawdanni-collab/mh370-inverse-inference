name: Temporary Black Format Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: python -m pip install "black==26.5.1"
      - name: Emit canonical file
        run: |
          black tests/test_layer_namespace_registry_v3.py
          echo "BEGIN_FORMATTED_FILE_BASE64"
          base64 -w0 tests/test_layer_namespace_registry_v3.py
          echo
          echo "END_FORMATTED_FILE_BASE64"
