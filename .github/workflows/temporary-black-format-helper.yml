name: Temporary Black Format Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: python -m pip install "black==26.5.1"
      - name: Format canonical file
        run: black tests/test_layer_namespace_registry_v3.py
      - name: Upload canonical file
        uses: actions/upload-artifact@v4
        with:
          name: black-formatted-registry-v3-test
          path: tests/test_layer_namespace_registry_v3.py
          if-no-files-found: error
          retention-days: 1
