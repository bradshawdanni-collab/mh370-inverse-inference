name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set source date epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff diagnostic
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check . > ruff-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Ruff diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostic
          path: ruff-diagnostic.txt
      - name: Enforce Ruff result
        shell: bash
        run: exit "${{ steps.ruff.outputs.exit_code }}"
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
