[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mh370-inverse-inference"
version = "0.1.0"
description = "Reproducible inverse-inference framework for MH370 research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danielle Bradshaw" }]
dependencies = [
  "numpy>=1.26",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0.1",
  "ruff>=0.5",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mh370_inverse_inference"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mh370_inverse_inference"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=mh370_inverse_inference --cov-report=term-missing"
testpaths = ["tests"]
